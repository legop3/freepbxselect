; FreePBX Select: redirect ONLY extension 777 into the persistent menu.
; Install these sections in /etc/asterisk/extensions_override_freepbx.conf
; (or merge carefully if the file already has an [ext-local] section).
; Always back up the file and inspect "dialplan show 777@ext-local".
;
; EXTENSION 777 MUST BE A PJSIP PHONE. Check its actual FreePBX device ID.
;
[ext-local]
exten => 777,1,NoOp(FreePBX Select intercept for 777)
 same => n,Stasis(freepbxselect,incoming)
 ; STASISSTATUS=FAILED when the ARI app isn't registered; dial fallback.
 same => n,Goto(freepbxselect-fallback,s,1)

[freepbxselect-fallback]
exten => s,1,NoOp(Fallback: ring 777 directly)
 same => n,Dial(PJSIP/777,30)
 same => n,Hangup()
