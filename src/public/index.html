<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreePBX Select</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:system-ui,Arial;display:grid;grid-template-rows:minmax(0,1fr) 25%;width:100vw;height:100dvh}
main{min-width:0;min-height:0;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;text-align:center;font-weight:400;line-height:1}
main span{display:block;min-width:0;width:100%;overflow-wrap:anywhere}
footer{width:100%;height:100%;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0}
button{min-width:0;min-height:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:#282828;color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;overflow:hidden}
button+button{border-left:2px solid #555}
button:active,button.lit{background:#fff;color:#000}
button svg{width:100%;height:100%;display:block;fill:currentColor}
#b2,button.text-label{font-family:system-ui,Arial;font-weight:400;font-size:1px;line-height:1;letter-spacing:-.04em;white-space:nowrap}
</style></head><body><main><span id="name"></span></main><footer><button id="b1" aria-label="Previous contact"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M63 8 L24 50 L63 92 L75 81 L47 50 L75 19 Z"/></svg></button><button id="b2" aria-label="Call or hang up">CALL</button><button id="b3" aria-label="Next contact"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M37 8 L76 50 L37 92 L25 81 L53 50 L25 19 Z"/></svg></button></footer>
<script>
const name=document.getElementById('name');let current=null,lastPress=0,lightTimer=null;
function showState(state){showName(state.name||'—');renderButtons(state);if(state.buttonPress&&state.buttonPress!==lastPress){lastPress=state.buttonPress;const button=document.getElementById('b'+state.lastButton);document.querySelectorAll('footer button').forEach(b=>b.classList.remove('lit'));clearTimeout(lightTimer);if(button){button.classList.add('lit');lightTimer=setTimeout(()=>button.classList.remove('lit'),220)}}}
// Fit using the browser's actual multiline layout, not a single-line estimate.
// Fixed 17-pass binary search: no recursion, resize observers, or feedback loop.
function fitName(){
 const available=document.querySelector('main').clientHeight;
 let low=1,high=available;
 for(let i=0;i<17;i++){
  const size=(low+high)/2;
  name.style.fontSize=size+'px';
  if(name.scrollHeight<=available&&name.scrollWidth<=document.querySelector('main').clientWidth+1)low=size;
  else high=size;
 }
 name.style.fontSize=low+'px';
}
const arrowSvg={
 '←':'<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M63 8 L24 50 L63 92 L75 81 L47 50 L75 19 Z"/></svg>',
 '→':'<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M37 8 L76 50 L37 92 L25 81 L53 50 L25 19 Z"/></svg>'
};
const measure=document.createElement('canvas').getContext('2d');
function renderButtons(state){
 for(let i=1;i<=3;i++){
  const button=document.getElementById('b'+i);
  const label=state.buttons?.[i-1]??'';
  if(button.dataset.label!==label){
   button.replaceChildren();
   if(arrowSvg[label])button.innerHTML=arrowSvg[label];
   else button.textContent=label;
   button.dataset.label=label;
   button.classList.toggle('text-label',!arrowSvg[label]);
   button.setAttribute('aria-label',label==='←'?'Previous contact':label==='→'?'Next contact':label==='CALL'?'Call or cancel':label==='END'?'End call':label);
  }
 }
 fitButtons();
}
function fitButtons(){
 measure.font='400 100px system-ui,Arial';
 for(let i=1;i<=3;i++){
  const button=document.getElementById('b'+i);
  if(!button.classList.contains('text-label'))continue;
  const label=button.textContent;
  const width=measure.measureText(label).width;
  button.style.fontSize=Math.max(1,Math.min(button.clientHeight*.95,100*button.clientWidth*.98/Math.max(width,1)))+'px';
 }
}
function showName(text){name.textContent=text;fitName()}
window.addEventListener('resize',()=>{fitName();fitButtons()});
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();current=await r.json();showState(current)}catch{showName('Offline')}}
for(let i=1;i<=3;i++)document.getElementById('b'+i).addEventListener('click',()=>action(i));
async function action(key){try{await fetch('/api/'+key,{method:'POST'});await refresh()}catch{}}
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key==='ArrowLeft'?1:e.key==='ArrowRight'?3:e.key===' '||e.key==='Enter'?2:null;if(k!==null){e.preventDefault();action(k)}});
let gameHeld=false;setInterval(()=>{const p=navigator.getGamepads?.()[0];if(!p){gameHeld=false;return}const k=p.buttons[0]?.pressed?2:p.buttons[14]?.pressed||p.axes[0]<-.6?1:p.buttons[15]?.pressed||p.axes[0]>.6?3:null;if(k!==null&&!gameHeld)action(k);gameHeld=!!k},100);
const stream=new EventSource('/api/events');stream.onmessage=e=>{current=JSON.parse(e.data);showState(current)};
refresh();
setInterval(refresh,60000);
</script></body></html>
