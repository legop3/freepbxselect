<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreePBX Select</title>
<style>
*{box-sizing:border-box}
html{background:#000}
body{margin:0;background:#000;color:#fff;font-family:system-ui,Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;line-height:1;overflow-wrap:anywhere}
main span{display:block;width:100%}
footer{flex:none;height:25dvh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0;background:#111}
button{min-width:0;padding:0;border:0;border-radius:0;background:#282828;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
button+button{border-left:2px solid #555}button:active{background:#444}button#select{font:900 clamp(2rem,11dvh,8rem)/1 system-ui,Arial;letter-spacing:-.04em}button svg{display:block;width:90%;height:90%;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main><span id="name"></span></main><footer><button id="left" aria-label="Previous contact"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M70 14 30 50 70 86"/></svg></button><button id="select" aria-label="Call or hang up">CALL</button><button id="right" aria-label="Next contact"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 14 70 50 30 86"/></svg></button></footer>
<script>
const name=document.getElementById('name');let current=null;
// Fit using the browser's actual multiline layout, not a single-line estimate.
// Fixed 17-pass binary search: no recursion, resize observers, or feedback loop.
function fitName(){
 const available=document.querySelector('main').clientHeight;
 let low=1,high=available;
 for(let i=0;i<17;i++){
  const size=(low+high)/2;
  name.style.fontSize=size+'px';
  if(name.scrollHeight<=available&&name.scrollWidth<=document.querySelector('main').clientWidth+1)low=size;
  else high=size;
 }
 name.style.fontSize=low+'px';
}
function showName(text){name.textContent=text;fitName()}
window.addEventListener('resize',fitName);
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();current=await r.json();showName(current.name||'—')}catch{showName('Offline')}}
for(const key of ['left','select','right'])document.getElementById(key).addEventListener('click',()=>action(key));
async function action(key){try{await fetch('/api/'+key,{method:'POST'});await refresh()}catch{}}
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key===' '||e.key==='Enter'?'select':null;if(k){e.preventDefault();action(k)}});
let gameHeld=false;setInterval(()=>{const p=navigator.getGamepads?.()[0];if(!p){gameHeld=false;return}const k=p.buttons[0]?.pressed?'select':p.buttons[14]?.pressed||p.axes[0]<-.6?'left':p.buttons[15]?.pressed||p.axes[0]>.6?'right':null;if(k&&!gameHeld)action(k);gameHeld=!!k},100);
const stream=new EventSource('/api/events');stream.onmessage=e=>{current=JSON.parse(e.data);showName(current.name||'—')};
refresh();
</script></body></html>
