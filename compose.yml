services:
  freepbxselect:
    image: ghcr.io/legop3/freepbxselect:latest
    restart: unless-stopped
    # Host networking is necessary for Asterisk externalMedia's RTP stream.
    network_mode: host
    environment:
      PORT: "3000"
      RTP_PORT: "40000"
      RTP_HOST: "${RTP_HOST:?Set to the Docker host LAN IP reachable from Asterisk}"
      ARI_URL: "${ARI_URL:?e.g. http://192.168.0.25:8088/ari}"
      ARI_USER: "${ARI_USER:?}"
      ARI_PASSWORD: "${ARI_PASSWORD:?}"
      API_KEY: "${API_KEY:?}"
      INTERCOM_ENDPOINT: "${INTERCOM_ENDPOINT:-PJSIP/777}"
    volumes:
      - ./config.json:/app/config.json:ro
